<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WristBand Safety Dashboard — WristBand</title>
  <meta name="description" content="WristBand women's safety platform: WristBand Safety Dashboard." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="32" height="32" /> WristBand</a>
    <nav aria-label="Main"><a href="index.html" aria-current="page">Dashboard</a><a href="contacts.html">Contacts</a><a href="travel.html">Travel Safety</a><a href="vault.html">Evidence Vault</a><a href="devices.html">Devices</a><a href="profile.html">Profile & PINs</a><a href="admin.html">Admin</a></nav>
    <button id="sos-btn" class="sos" type="button">SOS</button>
    <button id="logout" class="ghost" type="button">Sign out</button>
  </header>
  <main id="main">
    <h1>WristBand Safety Dashboard</h1>
    <div id="flash" role="status" aria-live="polite"></div>
    <section class="grid">
      <article class="card"><h2>Status</h2><p id="status" class="big">—</p></article>
      <article class="card"><h2>Safety score</h2><p id="score" class="big">—</p></article>
      <article class="card"><h2>Emergency contacts</h2><p id="contacts-count" class="big">—</p></article>
      <article class="card"><h2>Active journey</h2><p id="journey">None</p></article>
    </section>
    <section class="card"><h2>Devices</h2><ul id="devices"></ul></section>
    <section class="card"><h2>Recent SOS</h2><ul id="sos-list"></ul></section>
    <section class="card"><h2>Check-in</h2><button id="checkin" type="button">I'm safe</button></section>
  </main>
  <dialog id="sos-dialog">
    <h2>SOS active</h2>
    <p id="sos-msg"></p>
    <label>Enter PIN to cancel <input id="sos-pin" type="password" inputmode="numeric" maxlength="8" /></label>
    <div class="row"><button id="sos-cancel" type="button">Cancel SOS</button><button id="sos-close" class="ghost" type="button">Keep active</button></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sos.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
