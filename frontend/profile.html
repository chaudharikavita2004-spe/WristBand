<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile & PINs — WristBand</title>
  <meta name="description" content="WristBand women's safety platform: Profile & PINs." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="32" height="32" /> WristBand</a>
    <nav aria-label="Main"><a href="index.html">Dashboard</a><a href="contacts.html">Contacts</a><a href="travel.html">Travel Safety</a><a href="vault.html">Evidence Vault</a><a href="devices.html">Devices</a><a href="profile.html" aria-current="page">Profile & PINs</a><a href="admin.html">Admin</a></nav>
    <button id="sos-btn" class="sos" type="button">SOS</button>
    <button id="logout" class="ghost" type="button">Sign out</button>
  </header>
  <main id="main">
    <h1>Profile & PINs</h1>
    <div id="flash" role="status" aria-live="polite"></div>
    <form id="profile-form" class="card">
      <label>Full name <input name="full_name" maxlength="120" /></label>
      <label>Phone <input name="phone" maxlength="25" /></label>
      <label>Blood group <select name="blood_group"><option value="">—</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label>
      <label>Allergies <input name="allergies" /></label>
      <label>Cancel PIN (4-8 digits) <input name="cancel_pin" type="password" inputmode="numeric" /></label>
      <label>Duress PIN — looks like cancel, but keeps alerting <input name="duress_pin" type="password" inputmode="numeric" /></label>
      <button type="submit">Save</button>
    </form>
  </main>
  <dialog id="sos-dialog">
    <h2>SOS active</h2>
    <p id="sos-msg"></p>
    <label>Enter PIN to cancel <input id="sos-pin" type="password" inputmode="numeric" maxlength="8" /></label>
    <div class="row"><button id="sos-cancel" type="button">Cancel SOS</button><button id="sos-close" class="ghost" type="button">Keep active</button></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sos.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
