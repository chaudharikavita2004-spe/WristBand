<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Safety — WristBand</title>
  <meta name="description" content="WristBand women's safety platform: Travel Safety." />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="32" height="32" /> WristBand</a>
    <nav aria-label="Main"><a href="index.html">Dashboard</a><a href="contacts.html">Contacts</a><a href="travel.html" aria-current="page">Travel Safety</a><a href="vault.html">Evidence Vault</a><a href="devices.html">Devices</a><a href="profile.html">Profile & PINs</a><a href="admin.html">Admin</a></nav>
    <button id="sos-btn" class="sos" type="button">SOS</button>
    <button id="logout" class="ghost" type="button">Sign out</button>
  </header>
  <main id="main">
    <h1>Travel Safety</h1>
    <div id="flash" role="status" aria-live="polite"></div>
    <p class="note">Location is shared only while this page is open and location permission is granted. Background tracking is not supported.</p>
    <form id="journey-form" class="card">
      <label>Destination <input name="destination" required /></label>
      <label>Mode <select name="mode"><option>cab</option><option>walk</option><option>bus</option><option>train</option><option>car</option><option>other</option></select></label>
      <label>Vehicle details <input name="vehicle_info" placeholder="e.g. DL 01 AB 1234" /></label>
      <label>Expected minutes <input name="expected_minutes" type="number" min="1" max="1440" value="30" required /></label>
      <button type="submit">Start journey</button>
    </form>
    <section id="active" class="card" hidden>
      <h2>Active journey</h2><p id="active-info"></p><p id="loc-info" class="note"></p>
      <button id="end" type="button">I've arrived</button>
    </section>
    <ul id="journey-list" class="list"></ul>
  </main>
  <dialog id="sos-dialog">
    <h2>SOS active</h2>
    <p id="sos-msg"></p>
    <label>Enter PIN to cancel <input id="sos-pin" type="password" inputmode="numeric" maxlength="8" /></label>
    <div class="row"><button id="sos-cancel" type="button">Cancel SOS</button><button id="sos-close" class="ghost" type="button">Keep active</button></div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sos.js"></script>
  <script src="js/pages/travel.js"></script>
</body>
</html>
